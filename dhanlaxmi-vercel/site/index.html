<!doctype html>
<html lang="en">
  <head>

    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

    <style>
:root {
  --bg: #f6f3f0;
  --cd: #fff;
  --tx: #231f20;
  --mu: #7a7270;
  --bd: #e6dfda;
  --pr: #b3195f;
  --pt: #fff;
  --ok: #237a3b;
  --bad: #c92a2a;
  --sb: #2b1d2e;
  --warn: #b26a00;
  --wt: #fff;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #17131a;
    --cd: #211b25;
    --tx: #eee8f0;
    --mu: #a89fad;
    --bd: #362d3b;
    --pr: #ff6fae;
    --pt: #2a0e1c;
    --ok: #5fd07c;
    --bad: #ff7b7b;
    --sb: #0f0c11;
    --warn: #ffb454;
    --wt: #2a1a00;
  }
}
:root[data-theme="dark"] {
  --bg: #17131a;
  --cd: #211b25;
  --tx: #eee8f0;
  --mu: #a89fad;
  --bd: #362d3b;
  --pr: #ff6fae;
  --pt: #2a0e1c;
  --ok: #5fd07c;
  --bad: #ff7b7b;
  --sb: #0f0c11;
  --warn: #ffb454;
  --wt: #2a1a00;
}
* {
  box-sizing: border-box;
}
html,
body {
  height: 100%;
}
body {
  margin: 0;
  background: var(--bg);
  color: var(--tx);
  font: 14px/1.45 "Segoe UI", "Noto Sans Devanagari", system-ui, sans-serif;
  transition: background .3s, color .3s;
}
#app {
  display: flex;
  height: 100%;
}
nav {
  width: 200px;
  background: var(--sb);
  color: #e9dfe9;
  padding: 12px 8px;
  overflow: auto;
  flex: none;
}
nav h1 {
  font: 700 17px Georgia, serif;
  margin: 4px 8px 14px;
  color: #ffb3d3;
}
nav a {
  display: block;
  padding: 9px 12px;
  border-radius: 6px;
  cursor: pointer;
  color: #cfc3cf;
}
nav a.on,
nav a:hover {
  background: #4a2d4d;
  color: #fff;
}
main {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
}
header {
  display: flex;
  gap: 8px;
  align-items: center;
  padding: 10px 16px;
  background: var(--cd);
  border-bottom: 1px solid var(--bd);
}
header input {
  flex: 1;
  max-width: 340px;
}
#bc {
  color: var(--mu);
  font-size: 12px;
  padding: 8px 16px 0;
}
#v {
  padding: 12px 16px 40px;
  overflow: auto;
  flex: 1;
}
input,
select,
button {
  font: inherit;
  color: var(--tx);
  background: var(--cd);
  border: 1px solid var(--bd);
  border-radius: 6px;
  padding: 7px 10px;
}
button {
  cursor: pointer;
}
button.p {
  background: var(--pr);
  color: var(--pt);
  border-color: var(--pr);
  font-weight: 600;
}
button.x {
  color: var(--bad);
}
:focus-visible {
  outline: 2px solid var(--pr);
  outline-offset: 1px;
}
.g {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap: 10px;
  margin-bottom: 14px;
}
.c {
  background: var(--cd);
  border: 1px solid var(--bd);
  border-radius: 8px;
  padding: 12px;
  overflow-x: auto;
}
.seg {
  display: flex;
  margin-top: 8px;
  padding: 2px;
  border: 1px solid var(--bd);
  border-radius: 999px;
  gap: 2px;
}
.seg button {
  flex: 1;
  border: 0;
  background: transparent;
  border-radius: 999px;
  padding: 4px 8px;
  font-size: 12px;
  color: var(--mu);
  cursor: pointer;
}
.seg button.on {
  background: #ff5fa2;
  color: #1b1a1f;
  font-weight: 600;
}
.k b {
  display: block;
  font-size: 20px;
  margin-top: 2px;
}
.k details {
  margin-top: 8px;
  font-size: 12px;
}
.kd > span {
  font-size: 16px;
  color: var(--tx, inherit);
  font-weight: 600;
}
.kd details {
  font-size: 15px;
}
.kd details div b {
  display: inline;
  font-size: 15px;
  margin: 0;
}
.kd details div span {
  font-size: 14px;
}
.k summary {
  cursor: pointer;
  color: var(--mu);
}
.k details div {
  display: flex;
  justify-content: space-between;
  gap: 8px;
  padding: 4px 0;
  border-top: 1px solid var(--bd);
}
.k span,
.mu {
  color: var(--mu);
  font-size: 12px;
}
.bad {
  color: var(--bad);
}
.ok {
  color: var(--ok);
}
table {
  width: 100%;
  border-collapse: collapse;
}
th,
td {
  text-align: left;
  padding: 7px 8px;
  border-bottom: 1px solid var(--bd);
  white-space: nowrap;
}
th {
  color: var(--mu);
  font-weight: 600;
  font-size: 12px;
}
tr.low {
  background: color-mix(in srgb, var(--warn) 12%, transparent);
}
tr.out {
  background: color-mix(in srgb, var(--bad) 14%, transparent);
}
.wb {
  background: var(--warn);
  color: var(--wt);
  border-radius: 10px;
  padding: 1px 8px;
  font-size: 11px;
}
.lgn {
  position: fixed;
  inset: 0;
  z-index: 1000;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 16px;
  background: #f3f3f4 url("data:image/svg+xml,%3Csvg%20xmlns=%22http://www.w3.org/2000/svg%22%20viewBox=%220%200%201600%20900%22%20preserveAspectRatio=%22xMidYMid%20slice%22%3E%0A%3Cdefs%3E%0A%3ClinearGradient%20id=%22a%22%20x1=%220%22%20y1=%220%22%20x2=%221%22%20y2=%221%22%3E%3Cstop%20offset=%220%22%20stop-color=%22%23ffffff%22/%3E%3Cstop%20offset=%221%22%20stop-color=%22%23ededee%22/%3E%3C/linearGradient%3E%0A%3ClinearGradient%20id=%22b%22%20x1=%220%22%20y1=%221%22%20x2=%221%22%20y2=%220%22%3E%3Cstop%20offset=%220%22%20stop-color=%22%23f6f6f7%22/%3E%3Cstop%20offset=%221%22%20stop-color=%22%23ffffff%22/%3E%3C/linearGradient%3E%0A%3Cfilter%20id=%22f%22%3E%3CfeGaussianBlur%20stdDeviation=%226%22/%3E%3C/filter%3E%0A%3C/defs%3E%0A%3Crect%20width=%221600%22%20height=%22900%22%20fill=%22%23f3f3f4%22/%3E%0A%3Cpolygon%20points=%220,80%20760,360%20760,520%200,300%22%20fill=%22url%28%23a%29%22/%3E%0A%3Cpolygon%20points=%220,80%20760,360%20760,380%200,110%22%20fill=%22%23dcdcde%22%20opacity=%22.6%22%20filter=%22url%28%23f%29%22/%3E%0A%3Cpolygon%20points=%22520,0%201220,0%201020,300%20700,120%22%20fill=%22url%28%23b%29%22/%3E%0A%3Cpolygon%20points=%221020,300%201220,0%201330,0%201600,0%201600,120%201160,330%22%20fill=%22%23ffffff%22%20opacity=%22.85%22/%3E%0A%3Cpolygon%20points=%22700,120%201020,300%201160,330%20900,440%20600,300%22%20fill=%22%23e7e7e8%22%20opacity=%22.7%22%20filter=%22url%28%23f%29%22/%3E%0A%3Cpolygon%20points=%220,560%20900,760%201180,900%200,900%22%20fill=%22url%28%23a%29%22/%3E%0A%3Cpolygon%20points=%220,560%20900,760%20900,790%200,600%22%20fill=%22%23d9d9db%22%20opacity=%22.55%22%20filter=%22url%28%23f%29%22/%3E%0A%3Cpolygon%20points=%221000,430%201600,380%201600,520%201060,560%22%20fill=%22%23ffffff%22%20opacity=%22.9%22/%3E%0A%3Cpolygon%20points=%221100,700%201600,640%201600,760%201160,820%22%20fill=%22%23ffffff%22%20opacity=%22.8%22/%3E%0A%3C/svg%3E") center / cover no-repeat;
}
.lgc {
  width: min(400px, 100%);
  background: #fff;
  color: #1f2937;
  border: 1px solid #e5e7eb;
  border-radius: 14px;
  padding: 32px;
  box-shadow: 0 8px 30px rgba(0, 0, 0, .06);
}
.lgc h1 {
  text-align: center;
  font-size: 20px;
  margin: 0 0 24px;
  color: #111827;
}
.lgc label {
  display: block;
  font-size: 14px;
  margin: 14px 0 0;
  color: #1f2937;
}
.lgc input {
  width: 100%;
  box-sizing: border-box;
  margin-top: 6px;
  padding: 11px 12px;
  font-size: 14px;
  background: #fff;
  color: #111827;
  border: 1px solid #d1d5db;
  border-radius: 8px;
}
.lgc input:focus {
  outline: none;
  border-color: #2563eb;
  box-shadow: 0 0 0 3px rgba(37, 99, 235, .15);
}
.lpw {
  position: relative;
  display: block;
}
.lpw input {
  padding-right: 40px;
}
.lpw button {
  position: absolute;
  right: 4px;
  top: 6px;
  height: 40px;
  padding: 0 8px;
  background: none;
  border: 0;
  color: #6b7280;
  cursor: pointer;
}
.lerr {
  display: block;
  min-height: 18px;
  margin-top: 8px;
  color: #dc2626;
  font-size: 13px;
}
.lgc .lbt {
  width: 100%;
  margin-top: 8px;
  padding: 12px;
  font-size: 14px;
  font-weight: 600;
  background: #2563eb;
  color: #fff;
  border: 0;
  border-radius: 8px;
  cursor: pointer;
}
.lgc .lbt:hover {
  background: #1d4ed8;
}
.md.wd {
  width: min(900px, 100%);
}
.bd {
  background: var(--bad);
  color: #fff;
  border-radius: 10px;
  padding: 1px 8px;
  font-size: 11px;
}
.tb {
  display: flex;
  gap: 8px;
  align-items: center;
  margin-bottom: 10px;
  flex-wrap: wrap;
}
.tb h2 {
  margin: 0;
  flex: 1;
  font: 600 18px Georgia, serif;
}
.bar {
  display: flex;
  align-items: center;
  gap: 6px;
  margin: 4px 0;
  font-size: 12px;
}
.bar i {
  display: block;
  height: 10px;
  background: var(--pr);
  border-radius: 3px;
}
.bar em {
  width: 90px;
  font-style: normal;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
#m .mb {
  position: fixed;
  inset: 0;
  background: #0008;
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 9;
  padding: 10px;
}
.md {
  background: var(--cd);
  border-radius: 10px;
  padding: 16px;
  width: min(560px, 100%);
  max-height: 92vh;
  overflow: auto;
}
.md label {
  display: block;
  margin: 8px 0;
  font-size: 12px;
  color: var(--mu);
}
.md label input,
.md label select {
  width: 100%;
  margin-top: 3px;
  color: var(--tx);
}
.ac {
  display: flex;
  gap: 8px;
  justify-content: flex-end;
  margin-top: 12px;
}
#t {
  position: fixed;
  right: 14px;
  bottom: 14px;
  z-index: 20;
}
#t div {
  background: var(--sb);
  color: #fff;
  padding: 9px 14px;
  border-radius: 6px;
  margin-top: 6px;
}
.es {
  text-align: center;
  color: var(--mu);
  padding: 28px;
}
@media (max-width: 760px) {
  nav {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    width: auto;
    display: flex;
    z-index: 5;
    padding: 4px;
    overflow-x: auto;
  }
  nav h1 {
    display: none;
  }
  nav a {
    padding: 8px 10px;
    white-space: nowrap;
  }
  #v {
    padding-bottom: 70px;
  }
}


.lgc{animation:pgIn .6s ease both}
@keyframes pgIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.wel{position:fixed;inset:0;z-index:99999;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 42%,#1e3a8a,#0b1220 72%);color:#fff;opacity:0;animation:welIn .5s cubic-bezier(.22,.61,.36,1) forwards;transition:opacity .8s cubic-bezier(.4,0,.2,1),transform .8s cubic-bezier(.4,0,.2,1),filter .8s ease;will-change:opacity,transform}
.wel.out{opacity:0!important;transform:scale(1.06);filter:blur(6px);pointer-events:none}
.welr{position:relative;width:96px;height:96px;margin-bottom:28px;opacity:0;transform:scale(.7);animation:welPop .7s .1s cubic-bezier(.34,1.4,.64,1) forwards}
.welr span{position:absolute;inset:0;border-radius:50%;border:3px solid transparent;border-top-color:#fbbf24;border-right-color:rgba(251,191,36,.25);animation:welSpin 1.6s cubic-bezier(.45,.05,.55,.95) infinite;will-change:transform}
.welr span:nth-child(2){inset:12px;border-top-color:#f472b6;border-right-color:rgba(244,114,182,.25);animation-duration:2s;animation-direction:reverse}
.welr span:nth-child(3){inset:26px;border-top-color:#38bdf8;border-right-color:rgba(56,189,248,.25);animation-duration:1.3s}
.welt{font-size:32px;font-weight:700;letter-spacing:.5px;text-align:center;padding:0 16px;color:#fff;text-shadow:0 0 24px rgba(251,191,36,.35);opacity:0;transform:translateY(16px);animation:welUp .9s .35s cubic-bezier(.22,.61,.36,1) forwards}
.wels{margin-top:12px;font-size:15px;letter-spacing:5px;text-transform:uppercase;opacity:0;transform:translateY(12px);animation:welUp2 .9s .65s cubic-bezier(.22,.61,.36,1) forwards}
@keyframes welIn{to{opacity:1}}
@keyframes welPop{to{opacity:1;transform:scale(1)}}
@keyframes welSpin{to{transform:rotate(360deg)}}
@keyframes welUp{to{opacity:1;transform:none}}
@keyframes welUp2{to{opacity:.8;transform:none}}

.nbk{--cd:#fffdf9;--tx:#1f2937;--mu:#6b5560;--bd:#e8b4b8;--ok:#15803d;--bad:#b91c1c;color:var(--tx);background:#fffdf9;border:1px solid #e8b4b8;border-radius:10px;padding:14px 16px 16px 30px;position:relative;box-shadow:0 4px 18px rgba(0,0,0,.08)}
.nbk::before{content:"";position:absolute;top:0;bottom:0;left:16px;width:2px;background:#e57373;opacity:.55;border-radius:2px}
.nbk .c{background:#fffdf9;border:1px solid #e8b4b8;border-radius:6px}
.nbk h2,.nbk h3,.nbk b{color:#1f2937}
.nbk table{border:1px solid #e8b4b8}
.nbk th,.nbk td{border:1px solid #e8b4b8;height:32px;padding:4px 8px;color:#1f2937}
.nbk th{background:#fbe9ea;color:#7f1d3a;font-size:12px;font-weight:700}
.nbk .mu{color:#6b5560}
</style>

const money = n => '₹' + (+n || 0).toLocaleString('en-IN', { maximumFractionDigits: 2 }),

const SHIFTS = { 1: '9 AM - 5 PM', 2: '5 PM - 1 AM', 3: '1 AM - 9 AM' },

  curShift = () => {

  },

const migrate = d => {
  d.notes = Array.isArray(d.notes) ? d.notes : [];
  // Only two categories and two units exist: Raw Material / Finished Product, Kg / Bag.
  const FIN = ['Finished Goods', 'Finished Product', 'Rangoli Colors', 'Decorative Items'];
  d.cats = ['Raw Material', 'Finished Product'];
  d.units = ['Kg', 'Bag'];
  d.prods.forEach(p => {
    p.cat = FIN.includes(p.cat) ? 'Finished Product' : 'Raw Material';
    if (p.unit != 'Kg') p.unit = 'Bag';
    if (p.cat == 'Finished Product' && !(p.kpb > 0)) p.kpb = parseFloat((String(p.name).match(/([\d.]+)\s*kg/i) || [])[1]) || 1;
  });
  delete d.inv;
  delete d.cust;
  delete d.sup;
  d.prods.forEach(p => {
    delete p.gst;
    delete p.hsn;
    delete p.sp;
  });
  d.moves.forEach(x => {
    delete x.sid;
    delete x.party;
    if (x.type == 'buy' || x.type == 'use') {
      x.reason = x.reason || (x.type == 'buy' ? 'Purchase Received' : 'Used in Production');
      x.sign = x.type == 'buy' ? 1 : -1;
      x.type = 'adj';
    }
  });
  return d;
};

function modal(title, body, ok, wide) {

      ok() === false || cl();
    };
}

const cl = () => $('#m').innerHTML = '';
// In-page confirm/alert. Native confirm() and alert() are silently blocked in sandboxed frames.
function ask(msg, yes) {
  modal('Confirm', `<div>${e(msg)}</div>`, yes);
  $('#ok').textContent = t('OK');
}

function form(title, fs, vals, cb) {
  modal(
    title,
    fs.map(f => `<label>${t(f[1])}${f[2]=='sel'?`<select id=f_${f[0]}>${f[3].map(o=>`<option value="${e(o[0])}">${e(o[1])}</option>`).join('')}</select>`:`<input id=f_${f[0]} type=${f[2]||'text'} value="${e(vals[f[0]])}" ${f[2]=='number'?'min=0 step=any':''}>`}<small class=bad id=r_${f[0]}></small></label>`).join(''),
    () => {
      let o = {},
        bad = 0;
      fs.forEach(f => {
        let v = $('#f_' + f[0]).value;
        $('#r_' + f[0]).textContent = '';
        if (f[4] && !v.trim()) {
          $('#r_' + f[0]).textContent = t('Required field');
          bad = 1;
        }
        if (f[2] == 'number') {
          if (v !== '' && (isNaN(v) || v < 0)) {
            $('#r_' + f[0]).textContent = t('Invalid number');
            bad = 1;
          }
          v = +v || 0;
        }
        o[f[0]] = v;
      });
      if (bad) return false;
      return cb(o);
    }
  );
  fs.forEach(f => {
    if (f[2] == 'sel' && vals[f[0]] != null) $('#f_' + f[0]).value = vals[f[0]];
  });
}

function edit(id, cat) {
  const o = db.prods.find(x => x.id == id) || {};
  cat = o.cat || cat || 'Raw Material';
  const fin = cat == 'Finished Product',
    title = id ? 'Edit' : fin ? 'Add Goods' : 'Add Raw Material',
    // Only fields still used by the tables: Name, Unit (raw only), Minimum Stock (drives Status), Quantity (new items only).
    fs = FD.prod().filter(f => f[0] != 'cat' && f[0] != 'sku' && f[0] != 'pp' && f[0] != 'kpb' && !(fin && f[0] == 'unit') && !(id && f[0] == 'stock'));

    if (id) {

  if (db.moves.some(m => m.pid == id)) {
    toast('Product has transactions. Use Archive instead.');

  ask(t('Delete this item?'), () => {
    db.prods = db.prods.filter(x => x.id != id);

    toast('Deleted');
    go(view);
  });
}

function arch(id) {
  const p = P(id);

const eff = m => m.type == 'in' ? m.qty : m.type == 'out' ? -m.qty : m.type == 'adj' || m.type == 'rev' ? m.sign * m.qty : 0,
  qtyTxt = m => m.type == 'adj' || m.type == 'rev' ? (m.sign > 0 ? '+' : '\u2212') + m.qty : m.qty,
  revSet = () => new Set(db.moves.filter(m => m.refId).map(m => m.refId)),
  REVERSIBLE = ['in', 'out', 'adj'],
  ADJ_REASONS = ['Opening count', 'Correction', 'Damage', 'Return', 'Purchase Received', 'Used in Production'],
  // Reasons that imply a direction. Reasons absent here (Correction, Return) allow either.
  REASON_DIR = { 'Opening count': 1, 'Purchase Received': 1, 'Damage': -1, 'Used in Production': -1 };

function adjForm(pid, dir, reason) {
  form(
    'Adjust Stock',
    [
      ['pid', 'Name', 'sel', popt()],
      ['dir', 'Direction', 'sel', [['1', t('Add')], ['-1', t('Remove')]]],
      ['qty', 'Quantity', 'number', '', 1],
      ['reason', 'Reason', 'sel', [['', '-'], ...ADJ_REASONS.map(r => [r, t(r)])], 1],
      ['rem', 'Remarks']
    ],
    { pid, dir: dir || '1', reason: reason || '' },
    o => {
      const p = P(o.pid),
        sg = +o.dir;
      if (!p.id) return false;
      if (!(o.qty > 0)) {
        toast('Invalid number');
        return false;
      }
      if (REASON_DIR[o.reason] && REASON_DIR[o.reason] !== sg) {
        toast(t(o.reason) + ': ' + t(REASON_DIR[o.reason] > 0 ? 'Add only' : 'Remove only'));
        return false;
      }
      if (sg < 0 && o.qty > p.stock) {
        toast('Insufficient stock');
        return false;
      }
      p.stock += sg * o.qty;
      db.moves.push({ id: uid(), d: shiftDate(), tm: nowTime(), pid: o.pid, type: 'adj', sign: sg, qty: o.qty, reason: o.reason, sh: '', rem: o.rem });
      save();
      toast('Stock Adjusted');
      go(view);
    }
  );
  // Raw Material / Goods slider: filters the Name list.
  const sel = $('#f_pid'),
    TABS = [['Raw Material', 'Raw Material'], ['Finished Product', 'Goods']],
    cur = P(pid);

  };

// Reversal never deletes or edits the original; it appends an opposite entry with refId -> original.
function revMove(id) {
  const m = db.moves.find(x => x.id == id),
    p = m ? P(m.pid) : {};
  if (!m || !p.id || m.refId || !REVERSIBLE.includes(m.type) || revSet().has(m.id)) return;
  const d = eff(m);
  if (p.stock - d < 0) {
    toast('Insufficient stock');
    return;
  }
  modal(
    'Reverse',
    `<div>${e(p.name)} \u00b7 ${tl(m.type)} \u00b7 ${qtyTxt(m)} \u00b7 ${e(m.d)} ${e(m.tm || '')}</div><label>${t('Remarks')}<input id=f_rem></label>`,
    () => {
      p.stock -= d;
      db.moves.push({ id: uid(), d: shiftDate(), tm: nowTime(), pid: m.pid, type: 'rev', sign: d > 0 ? -1 : 1, qty: m.qty, reason: 'Reversal', refId: m.id, sh: '', rem: $('#f_rem').value });
      save();
      toast('Movement Reversed');
      go(view);
    }
  );
}

  const r = b.closest('.rmr');
  if ($('#rm_rows').children.length > 1) r.remove();
  else { r.querySelector('.rm_q').value = ''; }
}
function rmForm() {
  const goods = db.prods.filter(p => !p.arch && p.cat == 'Finished Product');
  if (!goods.length || !db.prods.some(p => !p.arch && p.cat != 'Finished Product')) {
    toast('Add goods and raw materials first');
    return;
  }
  modal(
    'Raw Material Used',
    `<label>${t('Good Name')}<select id=rm_g>${goods.map(p => `<option value="${e(p.id)}">${e(p.name)}</option>`).join('')}</select></label><div style="margin:8px 0 4px"><b>${t('Raw Materials')}</b></div><div id=rm_rows>${rmRow()}</div><div class=tb style="margin:4px 0 8px"><button type=button class=p onclick="rmAdd()">${t('Add')}</button></div><label>${t('Remarks')} <span class=mu>(${t('Optional')})</span><input id=rm_rem></label><small class=bad id=rm_err></small>`,
    () => {
      const err = m => { $('#rm_err').textContent = m; return false; },
        rows = [...document.querySelectorAll('#rm_rows .rmr')].map(r => ({ pid: r.querySelector('.rm_p').value, qty: +r.querySelector('.rm_q').value, raw: r.querySelector('.rm_q').value })).filter(r => r.raw !== '');
      if (!rows.length) return err(t('Required field'));
      if (rows.some(r => !(r.qty > 0))) return err(t('Invalid number'));
      const tot = {};
      rows.forEach(r => tot[r.pid] = (tot[r.pid] || 0) + r.qty);
      for (const id in tot) if (tot[id] > avail(P(id))) return err(P(id).name + ': ' + t('Insufficient stock'));
      const g = $('#rm_g').value, rem = $('#rm_rem').value;
      rows.forEach(r => {
        P(r.pid).stock -= r.qty;
        db.moves.push({ id: uid(), d: shiftDate(), tm: nowTime(), pid: r.pid, gid: g, qty: r.qty, type: 'out', reason: TL.out, sh: '3', rem });
      });
      save();
      toast('Stock Removed');
      go(view);
    },
    1
  );
}

const RG = { f: '', to: '' },
  inR = d => (!RG.f || d >= RG.f) && (!RG.to || d <= RG.to),
  plain = h => String(h).replace(/<[^>]*>/g, ' ').replace(/&(amp|lt|gt|quot|#39);/g, (m, c) => ({ amp: '&', lt: '<', gt: '>', quot: '"', '#39': "'" }[c])),
  // Search matches the text the user sees in the cells (last `skip` cells, e.g. Actions, are ignored).
  srch = (rows, skip = 0) => {
    const q = $('#q').value.toLowerCase().split(/\s+/).filter(Boolean);
    return q.length ? rows.filter(r => {
      const c = Array.isArray(r) ? r : r.c,
        x = c.slice(0, c.length - skip).map(plain).join(' ').toLowerCase();
      return q.every(w => x.includes(w));
    }) : rows;
  },
  setRg = (f, to) => {
    if (f && to && f > to) [f, to] = [to, f];
    RG.f = f;
    RG.to = to;
    page = 0;
    go(view);
  },
  rangeBar = () => {
    const b = new Date(shiftDate() + 'T00:00:00'),
      td = ymd(b),
      ago = n => {
        const d = new Date(b);
        d.setDate(d.getDate() - n);
        return ymd(d);
      };
    return `<div class=tb><span class=mu>${t('From')}</span><input type=date value="${e(RG.f)}" onchange="setRg(this.value,RG.to)"><span class=mu>${t('To')}</span><input type=date value="${e(RG.to)}" onchange="setRg(RG.f,this.value)">${btn(`setRg('${td}','${td}')`, 'Today')}${btn(`setRg('${ago(6)}','${td}')`, 'Last 7 days')}${btn(`setRg('${ago(29)}','${td}')`, 'Last 30 days')}${btn(`setRg('','')`, 'Clear')}</div>`;
  },
  kp = (l, v, c, sub) => `<div class="c k"><span>${t(l)}</span><b class=${c || ''}>${v}</b>${sub ? `<span>${sub}</span>` : ''}</div>`,
  invStats = () => {
    const ps = db.prods.filter(p => !p.arch);
    return {
      ps,
      low: ps.filter(p => lvl(p) == 'low'),
      out: ps.filter(p => lvl(p) == 'out'),
      nop: ps.filter(p => !p.pp).length,
      sv: ps.reduce((n, p) => n + p.stock * (+p.pp || 0), 0)
    };
  },
  remTxt = x => {
    const o = x.refId != null ? db.moves.find(m => m.id == x.refId) || {} : null;
    return (o ? `${t('Reversal of')} ${e(o.d)} ${e(o.tm || '')}${x.rem ? ' \u00b7 ' : ''}` : '') + e(x.rem);
  };

// Per-product movement history with running balance (respects the active date range).
function hist(id) {
  const p = P(id),
    rs = revSet();
  let bal = p.stock;
  const rows = db.moves.filter(m => m.pid == id).reverse().map(m => {
    const a = bal;
    bal -= eff(m);
    return [m, a];
  }).filter(r => inR(r[0].d));
  modal(
    'History',
    `<p class=mu><b>${e(p.name)}</b> \u00b7 ${t('Stock')}: ${p.stock} ${e(t(p.unit))}${RG.f || RG.to ? ` \u00b7 ${e(RG.f || '\u2026')} \u2013 ${e(RG.to || '\u2026')}` : ''}</p>` +
      (rows.length ? `<div style="overflow-x:auto"><table><tr>${['Date', 'Time', 'Batch', 'Type', 'Reason', 'Quantity', 'Balance', 'Remarks'].map(h => `<th>${t(h)}</th>`).join('')}</tr>${rows.map(([m, a]) => `<tr><td>${e(m.d)}</td><td>${e(m.tm || '-')}</td><td>${e(shName(m.sh))}</td><td>${tl(m.type)}</td><td>${t(m.reason || '')}</td><td>${qtyTxt(m)}</td><td>${a}</td><td>${remTxt(m)}${rs.has(m.id) ? ` <span class=mu>(${t('Reversed')})</span>` : ''}</td></tr>`).join('')}</table></div>` : `<div class=es>${t('Nothing here yet')}</div>`),
    0,
    1
  );
}

// rows: arrays of cell HTML, or {c: cells, k: row class}
function tbl(h, rows, np, W) {
  if (!rows.length) return `<div class=es>${t('Nothing here yet')}</div>`;
  if (np) return `<div class=c style="overflow-x:auto"><table style="table-layout:fixed;min-width:${(W||[170,120,70,90,120,110,130,80,460]).reduce((a,b)=>a+b,0)}px"><colgroup>${(W||[170,120,70,90,120,110,130,80,460]).map(w=>`<col style="width:${w}px">`).join('')}</colgroup><tr>${h.map(x=>`<th>${t(x)}</th>`).join('')}</tr>${rows.map(r=>`<tr ${r.k?'class='+r.k:''}>${(Array.isArray(r)?r:r.c).map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</table></div>`;
  const n = Math.ceil(rows.length / 20);
  page = Math.min(page, n - 1);
  return `<div class=c><table><tr>${h.map(x=>`<th>${t(x)}</th>`).join('')}</tr>${rows.slice(page*20,page*20+20).map(r=>`<tr ${r.k?'class='+r.k:''}>${(Array.isArray(r)?r:r.c).map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</table>${n>1?`<div class=tb style="margin:8px 0 0"><button onclick="page--;go(view)" ${page?'':'disabled'}>${t('Previous')}</button><span class=mu>${page+1}/${n}</span><button onclick="page++;go(view)" ${page<n-1?'':'disabled'}>${t('Next')}</button></div>`:''}</div>`;
}

// Sums quantities per unit so kg, bags and packets are never added together.
const sumU = (a, ty) => {
    const o = {};
    a.forEach(x => {
      if (ty && x.type != ty) return;
      const u = P(x.pid).unit || '-';
      o[u] = (o[u] || 0) + x.qty;
    });
    return o;
  },
  addU = (a, b, k = 1) => {
    const o = { ...a };
    Object.keys(b).forEach(u => (o[u] = (o[u] || 0) + k * b[u]));
    return o;
  },
  fmtU = o => Object.keys(o).filter(u => o[u]).map(u => `${Math.round(o[u] * 100) / 100} ${e(t(u))}`).join(' \u00b7 ') || '0',
  negU = o => Object.values(o).some(v => v < 0);
const bars = it => {
  const m = Math.max(1, ...it.map(x => x[1]));
  return it.map(x => `<div class=bar><em>${e(x[0])}</em><i style="width:${x[1]/m*60}%"></i>${Math.round(x[1]).toLocaleString('en-IN')}</div>`).join('') ||
    `<div class=mu>${t('Nothing here yet')}</div>`;
};
const mon = d => d.slice(0, 7);
const kdRow = m => `<div><span>${e(P(m.pid).name)}${m.gid && P(m.gid).id ? ' \u2192 ' + e(P(m.gid).name) : ''}${m.sh == '1' || m.sh == '2' ? ' \u00b7 ' + t(m.sh == '1' ? 'Day Shift' : 'Night Shift') : ''}${m.tm ? ' (' + e(m.tm) + ')' : ''}</span><b>${m.qty} ${e(t(P(m.pid).unit || ''))}</b></div>`,
  // Raw Material Used entries are grouped under the Good they were used for: Good name, then each raw material.
  kdList = a => {
    const gs = [], seen = {};
    a.forEach(m => {
      if (m.type == 'out' && m.gid && P(m.gid).id) {
        const k = m.gid + '|' + m.d + '|' + (m.tm || '');
        if (!seen[k]) gs.push(seen[k] = { g: m.gid, tm: m.tm, rows: [] });
        seen[k].rows.push(m);
      } else gs.push({ rows: [m] });
    });
    return gs.map(x => x.g
      ? `<div style="margin-top:6px"><b>${e(P(x.g).name)}${x.tm ? ' (' + e(x.tm) + ')' : ''}</b></div>` + x.rows.map(m => `<div style="padding-left:12px"><span>${e(P(m.pid).name)}</span><b>${m.qty} ${e(t(P(m.pid).unit || ''))}</b></div>`).join('')
      : kdRow(x.rows[0])).join('');
  },
  kd = (l, v, a, sub, c) => `<div class="c k kd"><span>${t(l)}</span><details><summary>${t(a.length ? 'View entries' : 'No entries')}${a.length ? ' (' + a.length + ')' : ''}</summary>${kdList(a)}</details></div>`;
// Balance Left card with a dropdown: Goods, then Raw Material, each listing name and stock left.
const balLeft = (ps, v, c) => {
  const grp = (h, a) => `<div style="margin-top:6px"><b>${t(h)}:-</b></div>` + (a.length ? a.map(p => `<div style="padding-left:12px"><span>${e(p.name)}</span><b class=${lvl(p) == 'ok' ? '' : 'bad'}>${p.stock} ${e(t(p.unit || ''))}</b></div>`).join('') : `<div style="padding-left:12px"><span class=mu>${t('No entries')}</span></div>`);
  return `<div class="c k kd"><span>${t('Balance Left')}</span><details><summary>${t('View entries')}</summary>${grp('Goods', ps.filter(p => p.cat == 'Finished Product'))}${grp('Raw Material', ps.filter(p => p.cat != 'Finished Product'))}</details></div>`;
};

const B = (h, n) => `<div class=tb><h2>${t(h)}</h2>${n||''}</div>`,
  btn = (f, l, c) => `<button class="${c||''}" onclick="${f}">${t(l)}</button>`;
const V = {
  dash() {
    const { ps, low, out, nop, sv } = invStats(),
      any = RG.f || RG.to,
      td = shiftDate(),
      rf = any ? RG.f : td,
      rt = any ? RG.to : td,
      inr = d => (!rf || d >= rf) && (!rt || d <= rt),
      lbl = any ? `${e(rf || '\u2026')} \u2013 ${e(rt || '\u2026')}` : td;
    // Originals reversed (all-time / same-range) are excluded from in/out totals; the ledger still shows both rows.
    const rs = revSet(),
      mvl = db.moves.filter(x => !rs.has(x.id) && inr(x.d)),
      mi = sumU(mvl, 'in'),
      mo = sumU(mvl, 'out'),
      mvBars = [].concat(
        Object.keys(mi).map(u => [`${t('Batch In')} (${t(u)})`, mi[u]]),
        Object.keys(mo).map(u => [`${t('Raw Material Used')} (${t(u)})`, mo[u]])
      );
    const cy = db.moves.filter(x => inr(x.d)),
      ri = new Set(cy.filter(x => x.refId).map(x => x.refId)),
      lv = cy.filter(x => !ri.has(x.id)),
      sum = (a, ty) => a.filter(x => x.type == ty).reduce((s, x) => s + x.qty, 0),
      e1 = lv.filter(x => x.sh == '1' && x.type == 'in'),
      e2 = lv.filter(x => x.sh == '2' && x.type == 'in'),
      eo = lv.filter(x => x.type == 'out'),
      b1 = sumU(lv.filter(x => x.sh == '1'), 'in'),
      b2 = sumU(lv.filter(x => x.sh == '2'), 'in'),
      dl = sumU(lv, 'out'),
      bal = addU(addU(b1, b2), dl, -1),
      ss = ps.map(p => {
        const m = cy.filter(x => x.pid == p.id),
          l = lv.filter(x => x.pid == p.id),
          i = sum(l, 'in'), o = sum(l, 'out'),
          net = m.reduce((s, x) => s + eff(x), 0),
          after = rt ? db.moves.filter(x => x.pid == p.id && x.d > rt).reduce((s, x) => s + eff(x), 0) : 0,
          close = p.stock - after;
        return [e(p.name), close - net, i, o, net - (i - o), close];
      });
    return `<div class=g><div class="c k"><span>${t('Total Products')}</span><b>${ps.filter(p=>p.cat==tpc).length}</b><div class=seg>${db.cats.map(c=>`<button class="${c==tpc?'on':''}" onclick="tpc='${c}';go('dash')">${t(c)}</button>`).join('')}</div></div>${kp('Low Stock Items',low.length,low.length?'bad':'')}${kp('Out of Stock',out.length,out.length?'bad':'')}${kp('Inventory Value',money(sv),'',nop?`${nop} ${t('without price')}`:'')}</div>
<div class=c style="margin-bottom:10px"><b>${t('Quick Actions')}</b><div class=tb style="margin:8px 0 0">${btn("go('prod');edit(null,'Raw Material')",'Add Raw Material')}${btn('stockForm()','Batch In','p')}${btn('rmForm()','Raw Material Used','p')}</div></div>
${rangeBar()}<h3>${t(any?'Batch Summary':'Batch Summary (Today)')} <span class=mu>${lbl}</span></h3><div class=g style="align-items:stretch">${kd('Day Shift',fmtU(b1),e1)}${kd('Night Shift',fmtU(b2),e2)}${kd('Total Batch',fmtU(addU(b1,b2)),[...e1,...e2])}${kd('Raw Material Used',fmtU(dl),eo)}${balLeft(ps,fmtU(bal),negU(bal)?'bad':'ok')}</div>
<h3>${t(any?'Stock Summary':'Stock Summary (Today)')} <span class=mu>${lbl}</span></h3>${tbl(['Name','Opening Stock','Batch In','Raw Material Used','Adjustment','Closing Stock'],ss)}
<h3>${t('Recent Stock Entries')}</h3>${tbl(['Date','Batch','Name','Type','Quantity'],db.moves.slice(-5).reverse().map(x=>[x.d,e(shName(x.sh)),e(P(x.pid).name),tl(x.type),qtyTxt(x)]))}`;
  },
  prod() {
    const { low, out, nop, sv } = invStats(),
      rk = p => p.arch ? 3 : { out: 0, low: 1, ok: 2 }[lvl(p)],
      bdg = p => p.arch ? '-' : { out: `<span class=bd>${t('Out')}</span>`, low: `<span class=wb>${t('Low')}</span>`, ok: `<span class=ok>${t('OK')}</span>` }[lvl(p)],
      anyR = RG.f || RG.to, tdy = shiftDate(), sf = anyR ? RG.f : tdy, st = anyR ? RG.to : tdy,
      cyc = db.moves.filter(x => (!sf || x.d >= sf) && (!st || x.d <= st)),
      rfs = new Set(cyc.filter(x => x.refId).map(x => x.refId)),
      lvv = cyc.filter(x => !rfs.has(x.id)),
      flow = p => {
        const m = cyc.filter(x => x.pid == p.id),
          net = m.reduce((a, x) => a + eff(x), 0),
          aft = st ? db.moves.filter(x => x.pid == p.id && x.d > st).reduce((a, x) => a + eff(x), 0) : 0,
          close = p.stock - aft,
          inn = m.reduce((a, x) => a + Math.max(eff(x), 0), 0),
          outq = m.reduce((a, x) => a + Math.max(-eff(x), 0), 0);
        return { open: close - net, inn, outq, close };
      },
      shQ = (p, sh) => lvv.filter(x => x.pid == p.id && x.type == 'in' && x.sh == sh).reduce((a, x) => a + x.qty, 0),
      pl = window._pl || '',
      pf = p => !pl || (pl == 'arch' ? p.arch : !p.arch && lvl(p) == pl),
      nm = p => e(p.name) + (p.arch ? ` <span class=mu>(${t('Archived')})</span>` : ''),
      acts = (p, main) => `<button onclick="edit('${p.id}')">${t('Edit')}</button> ${main} <button onclick="hist('${p.id}')">${t('History')}</button> <button onclick="arch('${p.id}')">${t(p.arch ? 'Unarchive' : 'Archive')}</button> <button class=x onclick="del('${p.id}')">${t('Delete')}</button>`,
      list = fin => srch(
        db.prods.filter(p => (p.cat == 'Finished Product') == fin && pf(p)).sort((a, b) => rk(a) - rk(b) || a.name.localeCompare(b.name)).map(p => {
          const f = flow(p), k = p.arch || lvl(p) == 'ok' ? '' : lvl(p);
          return fin ? {
            k,
            c: [nm(p), f.open, shQ(p, '1'), shQ(p, '2'), f.open + f.inn, f.close, bdg(p),
              acts(p, !p.arch ? `<button class=p onclick="stockForm('${p.id}')">${t('Batch In')}</button>` : '')]
          } : {
            k,
            c: [nm(p), f.open, f.inn, f.open + f.inn, f.outq, f.close, bdg(p),
              acts(p, !p.arch && lvl(p) != 'ok' ? `<button class=p onclick="adjForm('${p.id}','1','Purchase Received')">${t('Restock')}</button>` : '')]
          };
        }),
        1
      );
    return `<div class=nbk>` + B('Products',
      btn('adjForm()', 'Adjust Stock', 'p') + `<select onchange="_pl=this.value;go('prod')"><option value="">${t('All Status')}</option>${[['out', 'Out'], ['low', 'Low'], ['ok', 'OK'], ['arch', 'Archived']].map(o => `<option value="${o[0]}" ${pl == o[0] ? 'selected' : ''}>${t(o[1])}</option>`).join('')}</select>`) +
      `<div style="margin:8px 0 12px">${rangeBar()}</div>` +
      B('Goods', btn(`edit(null,'Finished Product')`, 'Add Goods', 'p')) +
      tbl(['Name', 'Opening Stock', 'Day Shift', 'Night Shift', 'Total (Yog)', 'Closing Stock', 'Status', 'Actions'], list(true), 1, [170,110,90,90,100,110,80,460]) +
      `<div style="height:16px"></div>` +
      B('Raw Materials', btn(`edit(null,'Raw Material')`, 'Add Raw Material', 'p')) +
      tbl(['Name', 'Opening Stock', 'Inflow', 'Total (Yog)', 'Used', 'Closing Stock', 'Status', 'Actions'], list(false), 1, [170,110,90,100,90,110,80,460]) + `<div style="height:16px"></div>` + B('Notes') + notesBlock() + `</div>`;
  },
  usr() {
    if (!isAdmin(ses)) return `<div class=es>${t('Admin only')}</div>`;
    return B('Users', btn('addUser()', 'Add', 'p')) +
      tbl(['Username', 'Role', 'Actions'], Object.keys(users).map(u => [e(u), t(isAdmin(u) ? 'Admin' : 'Staff'), `<button onclick="changePw('${e(u)}')">${t('Change Password')}</button> ` + (u == ses ? '' : `<button class=x onclick="delUser('${e(u)}')">${t('Delete')}</button>`)]));
  },
  stock() {
    const sf = window._sf || '',
      tf = window._tf || '',
      rs = revSet(),
      mvs = db.moves.filter(x => inR(x.d) && (!sf || x.sh == sf) && (!tf || x.type == tf)),
      live = ty => fmtU(sumU(mvs.filter(x => !rs.has(x.id)), ty)),
      rows = srch(
        mvs.slice().reverse().map(x => ({
          c: [
            x.d,
            e(x.tm || '-'),
            e(shName(x.sh)),
            e(P(x.pid).name),
            tl(x.type),
            t(x.reason || ''),
            qtyTxt(x),
            remTxt(x),
            rs.has(x.id) ? `<span class=mu>${t('Reversed')}</span>` : x.refId == null && REVERSIBLE.includes(x.type) ? `<button onclick="revMove('${x.id}')">${t('Reverse')}</button>` : ''
          ]
        })),
        1
      );
    return B(
      'Stock',
      `<select onchange="_tf=this.value;page=0;go('stock')"><option value="">${t('All Types')}</option>${['in', 'out', 'adj', 'rev'].map(k => `<option value="${k}" ${tf == k ? 'selected' : ''}>${tl(k)}</option>`).join('')}</select><select onchange="_sf=this.value;page=0;go('stock')"><option value="">${t('All Batches')}</option>${['1','2','3'].map(s=>`<option value="${s}" ${sf==s?'selected':''}>${e(shName(s))}</option>`).join('')}</select>${btn('stockForm()', 'Batch In', 'p')}${btn('rmForm()', 'Raw Material Used', 'p')}${btn('adjForm()', 'Adjust Stock')}`
    ) +
      rangeBar() +
      tbl(['Date', 'Time', 'Batch', 'Name', 'Type', 'Reason', 'Quantity', 'Remarks', 'Actions'], rows);
  }
};

const hash = async (u, p) => {
  const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(u + ':' + p));
  return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, '0')).join('');
};
const saveUsers = () => S.s('us', JSON.stringify(users));

function addUser() {
  if (!isAdmin(ses)) return;

    if (!/^[a-z0-9._@-]+$/.test(u) || o.p.length < 4 || users[u]) {

function delUser(u) {
  if (!isAdmin(ses) || !users[u]) return;

// Minimal .xlsx writer (stored ZIP, no external libraries).
const CRCT = (() => {
  const t = [];
  for (let n = 0; n < 256; n++) {
    let c = n;
    for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1;
    t[n] = c >>> 0;
  }
  return t;
})();
const crc32 = b => {
  let c = 0xFFFFFFFF;
  for (let i = 0; i < b.length; i++) c = CRCT[(c ^ b[i]) & 255] ^ (c >>> 8);
  return (c ^ 0xFFFFFFFF) >>> 0;
};
function zipStore(files) {
  const enc = new TextEncoder(), parts = [], cen = [];
  let off = 0;
  const u16 = v => [v & 255, (v >> 8) & 255], u32 = v => [v & 255, (v >>> 8) & 255, (v >>> 16) & 255, (v >>> 24) & 255];
  files.forEach(f => {
    const nm = enc.encode(f[0]), data = enc.encode(f[1]), crc = crc32(data);
    const lh = new Uint8Array([0x50, 0x4b, 3, 4, ...u16(20), ...u16(0x0800), ...u16(0), ...u16(0), ...u16(0x21), ...u32(crc), ...u32(data.length), ...u32(data.length), ...u16(nm.length), ...u16(0)]);
    parts.push(lh, nm, data);
    cen.push(new Uint8Array([0x50, 0x4b, 1, 2, ...u16(20), ...u16(20), ...u16(0x0800), ...u16(0), ...u16(0), ...u16(0x21), ...u32(crc), ...u32(data.length), ...u32(data.length), ...u16(nm.length), ...u16(0), ...u16(0), ...u16(0), ...u16(0), ...u32(0), ...u32(off)]), nm);
    off += lh.length + nm.length + data.length;
  });
  const cl = cen.reduce((a, x) => a + x.length, 0);
  const end = new Uint8Array([0x50, 0x4b, 5, 6, ...u16(0), ...u16(0), ...u16(files.length), ...u16(files.length), ...u32(cl), ...u32(off), ...u16(0)]);
  return new Blob([...parts, ...cen, end], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
}
function notesExport() {
  const rows = notesFiltered().slice().sort((a, b) => a.d.localeCompare(b.d));
  if (!rows.length) {
    toast('Nothing here yet');
    return;
  }
  const x = v => String(v ?? '').replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g, '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'),
    cell = (v, st) => `<c t="inlineStr" s="${st}"><is><t xml:space="preserve">${x(v)}</t></is></c>`,
    head = ['Date', 'Notes', 'Saved By', 'Saved At'],
    body = rows.map(n => `<row>${cell(n.d, 0)}${cell(n.text, 2)}${cell(n.by || '', 0)}${cell(n.at ? new Date(n.at).toLocaleString() : '', 0)}</row>`).join(''),
    sheet = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><cols><col min="1" max="1" width="14" customWidth="1"/><col min="2" max="2" width="90" customWidth="1"/><col min="3" max="3" width="16" customWidth="1"/><col min="4" max="4" width="22" customWidth="1"/></cols><sheetData><row>${head.map(h => cell(h, 1)).join('')}</row>${body}</sheetData></worksheet>`,
    files = [
      ['[Content_Types].xml', '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/></Types>'],
      ['_rels/.rels', '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>'],
      ['xl/workbook.xml', '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets><sheet name="Notes" sheetId="1" r:id="rId1"/></sheets></workbook>'],
      ['xl/_rels/workbook.xml.rels', '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/><Relationship Id="rId2" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>'],
      ['xl/styles.xml', '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><fonts count="2"><font><sz val="11"/><name val="Calibri"/></font><font><b/><sz val="11"/><name val="Calibri"/></font></fonts><fills count="2"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill></fills><borders count="1"><border><left/><right/><top/><bottom/><diagonal/></border></borders><cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs><cellXfs count="3"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0" applyAlignment="1"><alignment vertical="top"/></xf><xf numFmtId="0" fontId="1" fillId="0" borderId="0" xfId="0" applyFont="1"/><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0" applyAlignment="1"><alignment vertical="top" wrapText="1"/></xf></cellXfs></styleSheet>'],
      ['xl/worksheets/sheet1.xml', sheet]
    ],
    f = window._nf || '', to = window._nt || '',
    name = 'notes' + (f || to ? '_' + (f || 'start') + '_to_' + (to || 'end') : '') + '.xlsx',
    url = URL.createObjectURL(zipStore(files)),
    a = document.createElement('a');
  a.href = url;
  a.download = name;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
  toast('Exported');
}

function notifyLow() {
  const l = db.prods.filter(p => !p.arch && isLow(p));
  if (!l.length) return;
  const text = t('Low stock') + ': ' + l.map(p => p.name + ' ' + p.stock + ' ' + t(p.unit)).join(', ');

  try {
    if (window.Notification && Notification.permission == 'granted') new Notification(t('Dhanlaxmi Enterprises'), { body: text });
  } catch (x) {}

    fetch(CFG.notifyUrl, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ text, items: l.map(p => ({ name: p.name, stock: p.stock, unit: p.unit, min: p.min })) })

}
