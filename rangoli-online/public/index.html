    <style>
:root {
  --bg: #f6f3f0;
  --cd: #fff;
  --tx: #231f20;
  --mu: #7a7270;
  --bd: #e6dfda;
  --pr: #b3195f;
  --pt: #fff;
  --ok: #237a3b;
  --bad: #c92a2a;
  --sb: #2b1d2e;
  --warn: #b26a00;
  --wt: #fff;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #17131a;
    --cd: #211b25;
    --tx: #eee8f0;
    --mu: #a89fad;
    --bd: #362d3b;
    --pr: #ff6fae;
    --pt: #2a0e1c;
    --ok: #5fd07c;
    --bad: #ff7b7b;
    --sb: #0f0c11;
    --warn: #ffb454;
    --wt: #2a1a00;
  }
}
:root[data-theme="dark"] {
  --bg: #17131a;
  --cd: #211b25;
  --tx: #eee8f0;
  --mu: #a89fad;
  --bd: #362d3b;
  --pr: #ff6fae;
  --pt: #2a0e1c;
  --ok: #5fd07c;
  --bad: #ff7b7b;
  --sb: #0f0c11;
  --warn: #ffb454;
  --wt: #2a1a00;
}
* {
  box-sizing: border-box;
}
html,
body {
  height: 100%;
}
body {
  margin: 0;
  background: var(--bg);
  color: var(--tx);
  font: 14px/1.45 "Segoe UI", "Noto Sans Devanagari", system-ui, sans-serif;
  transition: background .3s, color .3s;
}
#app {
  display: flex;
  height: 100%;
}
nav {
  width: 200px;
  background: var(--sb);
  color: #e9dfe9;
  padding: 12px 8px;
  overflow: auto;
  flex: none;
}
nav h1 {
  font: 700 17px Georgia, serif;
  margin: 4px 8px 14px;
  color: #ffb3d3;
}
nav a {
  display: block;
  padding: 9px 12px;
  border-radius: 6px;
  cursor: pointer;
  color: #cfc3cf;
}
nav a.on,
nav a:hover {
  background: #4a2d4d;
  color: #fff;
}
main {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
}
header {
  display: flex;
  gap: 8px;
  align-items: center;
  padding: 10px 16px;
  background: var(--cd);
  border-bottom: 1px solid var(--bd);
}
header input {
  flex: 1;
  max-width: 340px;
}
#bc {
  color: var(--mu);
  font-size: 12px;
  padding: 8px 16px 0;
}
#v {
  padding: 12px 16px 40px;
  overflow: auto;
  flex: 1;
}
input,
select,
button {
  font: inherit;
  color: var(--tx);
  background: var(--cd);
  border: 1px solid var(--bd);
  border-radius: 6px;
  padding: 7px 10px;
}
button {
  cursor: pointer;
}
button.p {
  background: var(--pr);
  color: var(--pt);
  border-color: var(--pr);
  font-weight: 600;
}
button.x {
  color: var(--bad);
}
:focus-visible {
  outline: 2px solid var(--pr);
  outline-offset: 1px;
}
.g {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap: 10px;
  margin-bottom: 14px;
}
.c {
  background: var(--cd);
  border: 1px solid var(--bd);
  border-radius: 8px;
  padding: 12px;
  overflow-x: auto;
}
.k b {
  display: block;
  font-size: 20px;
  margin-top: 2px;
}
.k span,
.mu {
  color: var(--mu);
  font-size: 12px;
}
.bad {
  color: var(--bad);
}
.ok {
  color: var(--ok);
}
table {
  width: 100%;
  border-collapse: collapse;
}
th,
td {
  text-align: left;
  padding: 7px 8px;
  border-bottom: 1px solid var(--bd);
  white-space: nowrap;
}
th {
  color: var(--mu);
  font-weight: 600;
  font-size: 12px;
}
tr.low {
  background: color-mix(in srgb, var(--warn) 12%, transparent);
}
tr.out {
  background: color-mix(in srgb, var(--bad) 14%, transparent);
}
.wb {
  background: var(--warn);
  color: var(--wt);
  border-radius: 10px;
  padding: 1px 8px;
  font-size: 11px;
}
.md.wd {
  width: min(900px, 100%);
}
.bd {
  background: var(--bad);
  color: #fff;
  border-radius: 10px;
  padding: 1px 8px;
  font-size: 11px;
}
.tb {
  display: flex;
  gap: 8px;
  align-items: center;
  margin-bottom: 10px;
  flex-wrap: wrap;
}
.tb h2 {
  margin: 0;
  flex: 1;
  font: 600 18px Georgia, serif;
}
.bar {
  display: flex;
  align-items: center;
  gap: 6px;
  margin: 4px 0;
  font-size: 12px;
}
.bar i {
  display: block;
  height: 10px;
  background: var(--pr);
  border-radius: 3px;
}
.bar em {
  width: 90px;
  font-style: normal;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
#m .mb {
  position: fixed;
  inset: 0;
  background: #0008;
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 9;
  padding: 10px;
}
.md {
  background: var(--cd);
  border-radius: 10px;
  padding: 16px;
  width: min(560px, 100%);
  max-height: 92vh;
  overflow: auto;
}
.md label {
  display: block;
  margin: 8px 0;
  font-size: 12px;
  color: var(--mu);
}
.md label input,
.md label select {
  width: 100%;
  margin-top: 3px;
  color: var(--tx);
}
.ac {
  display: flex;
  gap: 8px;
  justify-content: flex-end;
  margin-top: 12px;
}
#t {
  position: fixed;
  right: 14px;
  bottom: 14px;
  z-index: 20;
}
#t div {
  background: var(--sb);
  color: #fff;
  padding: 9px 14px;
  border-radius: 6px;
  margin-top: 6px;
}
.es {
  text-align: center;
  color: var(--mu);
  padding: 28px;
}
@media (max-width: 760px) {
  nav {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    width: auto;
    display: flex;
    z-index: 5;
    padding: 4px;
    overflow-x: auto;
  }
  nav h1 {
    display: none;
  }
  nav a {
    padding: 8px 10px;
    white-space: nowrap;
  }
  #v {
    padding-bottom: 70px;
  }
}

</style>

  'Stock Summary': 'स्टॉक सारांश',

  'Used in Production': 'उत्पादन में उपयोग',

  'Use Adjust Stock for this category': 'इस श्रेणी के लिए स्टॉक समायोजन उपयोग करें'
};
const S = {
  g(k) {
    try {
      return localStorage.getItem(k);
    } catch (e) {
      return null;
    }
  },
  s(k, v) {
    try {
      localStorage.setItem(k, v);
      return 1;
    } catch (e) {
      return 0;
    }
  }
};
let lang = S.g('lg') || 'en',
  view = 'dash',
  page = 0,
  db;
const t = k => lang == 'hi' && HI[k] || k,
  $ = s => document.querySelector(s),
  e = s => String(s ?? '').replace(
    /[&<>"']/g,
    c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])
  );
const money = n => '₹' + (+n || 0).toLocaleString('en-IN', { maximumFractionDigits: 2 }),
  pad = n => String(n).padStart(2, '0'),
  ymd = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()),
  uid = () => Math.random().toString(36).slice(2, 9);

// Shifts: 1 = 09:00-17:00, 2 = 17:00-01:00 (next day).
const SHIFTS = { 1: '9 AM - 5 PM', 2: '5 PM - 1 AM', 3: '1 AM - 9 AM' },
  shName = s => s ? t(s == '3' ? 'Batch Out' : 'Batch ' + s) + ' (' + SHIFTS[s] + ')' : '-',
  curShift = () => {
    const n = new Date(),
      h = n.getHours() + n.getMinutes() / 60;
    return h >= 9 && h < 17 ? '1' : h >= 17 || h < 1 ? '2' : '3';
  },
  // 00:00-09:00 belongs to the previous day's cycle (Shift 2 tail + Delivery)
  shiftDate = () => {
    const n = new Date();
    if (n.getHours() < 9) n.setDate(n.getDate() - 1);
    return ymd(n);
  },
  nowTime = () => pad(new Date().getHours()) + ':' + pad(new Date().getMinutes());

function seed() {
  const P = (name, sku, cat, unit, sp, pp, stock, min) => ({
    id: uid(),
    name,
    sku,
    cat,
    unit,
    sp,
    pp,
    stock,
    min,
    arch: 0,
    res: 0
  });
  return {
    units: ['Kg', 'Piece', 'Packet', 'Box', 'Bag', 'Bottle', 'Drum', 'Roll', 'Gram', 'Dozen'],
    cats: ['Rangoli Colors', 'Raw Materials', 'Packaging', 'Decorative Items', 'Finished Goods'],
    prods: [
      P('Apple 16x24', 'APL-1624', 'Packaging', 'Piece', 3, 2, 6200, 5000),
      P('Anand 16x24', 'AND-1624', 'Packaging', 'Piece', 3, 2, 4200, 5000),
      P('Gulab Raja 16x22', 'GR-1622', 'Packaging', 'Piece', 3, 2, 7000, 5000),
      P('Rubine-W', 'RAW-RBW', 'Raw Materials', 'Kg', 420, 350, 180, 150),
      P('Yellow', 'RAW-YEL', 'Raw Materials', 'Kg', 380, 310, 90, 150),
      P('Green 7', 'RAW-GR7', 'Raw Materials', 'Kg', 400, 330, 320, 300),
      P('Rangoli 40 KG', 'FG-R40', 'Finished Goods', 'Bag', 1800, 1400, 60, 20),
      P('Apple 1 KG', 'FG-A1', 'Finished Goods', 'Packet', 70, 50, 500, 200),
      P('Oil', 'RAW-OIL', 'Raw Materials', 'Drum', 9000, 8000, 14, 10)
    ],
    moves: []
  };
}

db = { units: [], cats: [], prods: [], moves: [] }; // placeholder until loaded from the server
// Migrate legacy data: drop invoices, customers, suppliers, GST/HSN.
const migrate = d => {
  delete d.inv;
  delete d.cust;
  delete d.sup;
  d.prods.forEach(p => {
    delete p.gst;
    delete p.hsn;
    delete p.sp;
  });
  d.moves.forEach(x => {
    delete x.sid;
    delete x.party;
    if (x.type == 'buy' || x.type == 'use') {
      x.reason = x.reason || (x.type == 'buy' ? 'Purchase Received' : 'Used in Production');
      x.sign = x.type == 'buy' ? 1 : -1;
      x.type = 'adj';
    }
  });
  return d;
};
migrate(db);
let snap = JSON.stringify(db), ver = 0, gen = 0, pend = 0, saving = Promise.resolve();
// Saves the whole database to the server. Changes show instantly; if the server
// rejects them (someone else saved first, or no connection) they are rolled back.
const save = () => {
  const mine = JSON.parse(JSON.stringify(db)), g = gen;
  pend++;
  saving = saving.then(async () => {
    if (g != gen) return; // an earlier save failed, so this one is built on stale data
    const r = await api('/api/db', { method: 'POST', body: { db: mine, version: ver } });
    if (r.ok) {
      ver = r.d.version;
      snap = JSON.stringify(mine);
    } else if (r.status == 409) {
      gen++;
      db = migrate(r.d.db);
      ver = r.d.version;
      snap = JSON.stringify(db);
      toast('Someone else changed the data first. Your last change was NOT saved - please repeat it.');
      go(view);
    } else if (r.status != 401) {
      gen++;
      db = JSON.parse(snap);
      toast('Could not reach the server: your last change was NOT saved.');
      go(view);
    }
  }).finally(() => pend--);
};

function toast(m) {
  const d = document.createElement('div');
  d.textContent = t(m);
  $('#t').append(d);
  setTimeout(() => d.remove(), 2200);
}

const P = id => db.prods.find(p => p.id == id) || {},
  // Out: nothing left. Low: 1..min. OK: above min.
  lvl = p => p.stock <= 0 ? 'out' : p.stock <= p.min ? 'low' : 'ok',
  isLow = p => lvl(p) != 'ok',
  avail = p => p.stock - (p.res || 0);
const NAV = [
  ['dash', 'Dashboard'],
  ['prod', 'Products'],
  ['stock', 'Stock'],
  ['usr', 'Users']
];

function modal(title, body, ok, wide) {
  $('#m').innerHTML = `<div class=mb role=dialog aria-modal=true onclick="event.target==this&&cl()"><div class="md${wide?' wd':''}"><h3>${t(title)}</h3>${body}<div class=ac><button onclick=cl()>${t('Close')}</button>${ok?`<button class=p id=ok>${t('Save')}</button>`:''}</div></div></div>`;
  if (ok)
    $('#ok').onclick = () => {
      ok() === false || cl();
    };
}

const cl = () => $('#m').innerHTML = '';
// In-page confirm/alert. Native confirm() and alert() are silently blocked in sandboxed frames.
function ask(msg, yes) {
  modal('Confirm', `<div>${e(msg)}</div>`, yes);
  $('#ok').textContent = 'OK';
}

function form(title, fs, vals, cb) {
  modal(
    title,
    fs.map(f => `<label>${t(f[1])}${f[2]=='sel'?`<select id=f_${f[0]}>${f[3].map(o=>`<option value="${e(o[0])}">${e(o[1])}</option>`).join('')}</select>`:`<input id=f_${f[0]} type=${f[2]||'text'} value="${e(vals[f[0]])}" ${f[2]=='number'?'min=0 step=any':''}>`}<small class=bad id=r_${f[0]}></small></label>`).join(''),
    () => {
      let o = {},
        bad = 0;
      fs.forEach(f => {
        let v = $('#f_' + f[0]).value;
        $('#r_' + f[0]).textContent = '';
        if (f[4] && !v.trim()) {
          $('#r_' + f[0]).textContent = t('Required field');
          bad = 1;
        }
        if (f[2] == 'number') {
          if (v !== '' && (isNaN(v) || v < 0)) {
            $('#r_' + f[0]).textContent = t('Invalid number');
            bad = 1;
          }
          v = +v || 0;
        }
        o[f[0]] = v;
      });
      if (bad) return false;
      return cb(o);
    }
  );
  fs.forEach(f => {
    if (f[2] == 'sel' && vals[f[0]] != null) $('#f_' + f[0]).value = vals[f[0]];
  });
}

const opt = a => a.map(x => [x, x]),
  popt = () => db.prods.filter(p => !p.arch).map(p => [p.id, p.name]);
const FD = {
  prod: () => [
    ['name', 'Name', '', 0, 1],
    ['sku', 'SKU'],
    ['cat', 'Category', 'sel', opt(db.cats)],
    ['unit', 'Unit', 'sel', opt(db.units)],
    ['pp', 'Purchase Price', 'number'],
    ['stock', 'Opening Stock', 'number'],
    ['min', 'Minimum Stock', 'number']
  ]
};

function edit(id) {
  const o = db.prods.find(x => x.id == id) || {};
  form(id ? 'Edit' : 'Add Product', FD.prod().filter(f => !(id && f[0] == 'stock')), o, v => {
    if (id) {
      delete v.stock;
      Object.assign(o, v);
    } else db.prods.push({ id: uid(), arch: 0, res: 0, ...v });
    save();
    toast(id ? 'Product Updated' : 'Product Added');
    go(view);
  });
}

function del(id) {
  if (db.moves.some(m => m.pid == id)) {
    toast('Product has transactions. Use Archive instead.');
    return;
  }
  ask(t('Delete this item?'), () => {
    db.prods = db.prods.filter(x => x.id != id);
    save();
    toast('Deleted');
    go(view);
  });
}

function arch(id) {
  const p = P(id);
  if (!p.id) return;
  ask(t(p.arch ? 'Unarchive this item?' : 'Archive this item?'), () => {
    p.arch = p.arch ? 0 : 1;
    save();
    toast(p.arch ? 'Archived' : 'Unarchived');
    go(view);
  });
}

const TL = { in: 'Batch In', out: 'Batch Out', adj: 'Adjustment', rev: 'Reversal' },
  tl = ty => t(TL[ty] || ty);
// Stock effect of one movement. adj/rev carry an explicit sign (+1/-1).
const eff = m => m.type == 'in' ? m.qty : m.type == 'out' ? -m.qty : m.type == 'adj' || m.type == 'rev' ? m.sign * m.qty : 0,
  qtyTxt = m => m.type == 'adj' || m.type == 'rev' ? (m.sign > 0 ? '+' : '\u2212') + m.qty : m.qty,
  revSet = () => new Set(db.moves.filter(m => m.refId).map(m => m.refId)),
  REVERSIBLE = ['in', 'out', 'adj'],
  ADJ_REASONS = ['Opening count', 'Correction', 'Damage', 'Return', 'Purchase Received', 'Used in Production'],
  // Reasons that imply a direction. Reasons absent here (Correction, Return) allow either.
  REASON_DIR = { 'Opening count': 1, 'Purchase Received': 1, 'Damage': -1, 'Used in Production': -1 };

function adjForm(pid, dir, reason) {
  form(
    'Adjust Stock',
    [
      ['pid', 'Name', 'sel', popt()],
      ['dir', 'Direction', 'sel', [['1', t('Add')], ['-1', t('Remove')]]],
      ['qty', 'Quantity', 'number', '', 1],
      ['reason', 'Reason', 'sel', [['', '-'], ...ADJ_REASONS.map(r => [r, t(r)])], 1],
      ['rem', 'Remarks']
    ],
    { pid, dir: dir || '1', reason: reason || '' },
    o => {
      const p = P(o.pid),
        sg = +o.dir;
      if (!p.id) return false;
      if (!(o.qty > 0)) {
        toast('Invalid number');
        return false;
      }
      if (REASON_DIR[o.reason] && REASON_DIR[o.reason] !== sg) {
        toast(t(o.reason) + ': ' + t(REASON_DIR[o.reason] > 0 ? 'Add' : 'Remove') + ' only');
        return false;
      }
      if (sg < 0 && o.qty > p.stock) {
        toast('Insufficient stock');
        return false;
      }
      p.stock += sg * o.qty;
      db.moves.push({ id: uid(), d: shiftDate(), tm: nowTime(), pid: o.pid, type: 'adj', sign: sg, qty: o.qty, reason: o.reason, sh: '', rem: o.rem });
      save();
      toast('Stock Adjusted');
      go(view);
    }
  );
}

// Reversal never deletes or edits the original; it appends an opposite entry with refId -> original.
function revMove(id) {
  const m = db.moves.find(x => x.id == id),
    p = m ? P(m.pid) : {};
  if (!m || !p.id || m.refId || !REVERSIBLE.includes(m.type) || revSet().has(m.id)) return;
  const d = eff(m);
  if (p.stock - d < 0) {
    toast('Insufficient stock');
    return;
  }
  modal(
    'Reverse',
    `<div>${e(p.name)} \u00b7 ${tl(m.type)} \u00b7 ${qtyTxt(m)} \u00b7 ${e(m.d)} ${e(m.tm || '')}</div><label>${t('Remarks')}<input id=f_rem></label>`,
    () => {
      p.stock -= d;
      db.moves.push({ id: uid(), d: shiftDate(), tm: nowTime(), pid: m.pid, type: 'rev', sign: d > 0 ? -1 : 1, qty: m.qty, reason: 'Reversal', refId: m.id, sh: '', rem: $('#f_rem').value });
      save();
      toast('Movement Reversed');
      go(view);
    }
  );
}

function backup() {
  const lx = S.g('lx');
  modal(
    'Backup',
    `<p class=mu>${t('Last export')}: ${lx ? e(new Date(lx).toLocaleString()) : t('Never')}</p><div class=tb>${btn('exportData()', 'Export JSON', 'p')}</div><label>${t('Import JSON')}<input type=file accept=".json,application/json" onchange="importData(this)"></label><p class=mu>${t('Import replaces all current data.')}</p>`
  );
}

function exportData() {
  const n = new Date(),
    a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob(
    [JSON.stringify({ app: 'rangoli-erp', v: 1, exported: n.toISOString(), db }, null, 2)],
    { type: 'application/json' }
  ));
  a.download = `rangoli-erp-${ymd(n)}-${pad(n.getHours())}${pad(n.getMinutes())}.json`;
  document.body.append(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  S.s('lx', n.toISOString());
  toast('Exported');
}

function checkDb(d) {
  const ok = Number.isFinite;
  if (!d || typeof d != 'object' || ![d.prods, d.moves, d.cats, d.units].every(Array.isArray)) return 'Invalid file: missing prods/moves/cats/units.';
  const pids = new Set(),
    mids = new Set();
  for (const p of d.prods) {
    if (!p || p.id == null || pids.has(p.id) || typeof p.name != 'string' || !ok(p.stock) || !ok(p.min)) return 'Invalid file: bad product record.';
    pids.add(p.id);
  }
  for (const m of d.moves) {
    if (!m || m.id == null || mids.has(m.id) || !pids.has(m.pid) || typeof m.type != 'string' || !ok(m.qty) || m.qty <= 0 || typeof m.d != 'string') return 'Invalid file: bad movement record.';
    if ((m.type == 'adj' || m.type == 'rev') && m.sign !== 1 && m.sign !== -1) return 'Invalid file: bad movement sign.';
    mids.add(m.id);
  }
  if (d.moves.some(m => m.refId != null && !mids.has(m.refId))) return 'Invalid file: reversal points to a missing movement.';
  return '';
}

function importData(inp) {
  const f = inp.files[0];
  if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    let o;
    try {
      o = JSON.parse(r.result);
    } catch (x) {
      toast('Invalid file: not JSON.');
      return;
    }
    const d = o && o.db ? o.db : o,
      err = checkDb(d);
    if (err) {
      toast(err);
      return;
    }
    ask(`Replace ALL current data (${db.prods.length} products, ${db.moves.length} movements) with the file (${d.prods.length} products, ${d.moves.length} movements)?`, () => {
      db = migrate(d);
      save();
      cl();
      toast('Imported');
      go('dash');
    });
    inp.value = '';
  };
  r.readAsText(f);
}

// Batch In/Out is for made/sold goods. Raw materials and packaging go through Adjust Stock.
const BATCH_CATS = ['Finished Goods', 'Rangoli Colors', 'Decorative Items'],
  isBatch = p => BATCH_CATS.includes(p.cat),
  batchOpt = () => popt();

function stockForm(pid, mode) {
  mode = mode || 'in';
  // Same product list as the Products page; default the selection to a finished-goods item.
  pid = pid || (db.prods.find(p => !p.arch && isBatch(p)) || db.prods.find(p => !p.arch) || {}).id;
  const plus = mode == 'in',
    cs = curShift();
  form(
    TL[mode],
    [
      ['pid', 'Name', 'sel', batchOpt()],
      ...(mode == 'in' ? [['sh', 'Batch', 'sel', [['1', shName('1')], ['2', shName('2')]]]] : []),
      ['qty', 'Quantity', 'number', '', 1],
      ['rem', 'Remarks']
    ],
    { pid, sh: cs == '2' ? '2' : '1' },
    o => {
      const p = P(o.pid);
      if (!p.id) return false;
      if (!(o.qty > 0)) {
        toast('Invalid number');
        return false;
      }
      if (!plus && o.qty > avail(p)) {
        toast('Insufficient stock');
        return false;
      }
      o.type = mode;
      o.reason = mode == 'in' ? 'Manufacturing' : TL[mode];
      o.sh = mode == 'in' ? o.sh : mode == 'out' ? '3' : '';
      p.stock += plus ? o.qty : -o.qty;
      db.moves.push({ id: uid(), d: shiftDate(), tm: nowTime(), ...o });
      save();
      toast(plus ? 'Stock Added' : 'Stock Removed');
      go(view);
    }
  );
}

const RG = { f: '', to: '' },
  inR = d => (!RG.f || d >= RG.f) && (!RG.to || d <= RG.to),
  plain = h => String(h).replace(/<[^>]*>/g, ' ').replace(/&(amp|lt|gt|quot|#39);/g, (m, c) => ({ amp: '&', lt: '<', gt: '>', quot: '"', '#39': "'" }[c])),
  // Search matches the text the user sees in the cells (last `skip` cells, e.g. Actions, are ignored).
  srch = (rows, skip = 0) => {
    const q = $('#q').value.toLowerCase().split(/\s+/).filter(Boolean);
    return q.length ? rows.filter(r => {
      const c = Array.isArray(r) ? r : r.c,
        x = c.slice(0, c.length - skip).map(plain).join(' ').toLowerCase();
      return q.every(w => x.includes(w));
    }) : rows;
  },
  setRg = (f, to) => {
    if (f && to && f > to) [f, to] = [to, f];
    RG.f = f;
    RG.to = to;
    page = 0;
    go(view);
  },
  rangeBar = () => {
    const b = new Date(shiftDate() + 'T00:00:00'),
      td = ymd(b),
      ago = n => {
        const d = new Date(b);
        d.setDate(d.getDate() - n);
        return ymd(d);
      };
    return `<div class=tb><span class=mu>${t('From')}</span><input type=date value="${e(RG.f)}" onchange="setRg(this.value,RG.to)"><span class=mu>${t('To')}</span><input type=date value="${e(RG.to)}" onchange="setRg(RG.f,this.value)">${btn(`setRg('${td}','${td}')`, 'Today')}${btn(`setRg('${ago(6)}','${td}')`, 'Last 7 days')}${btn(`setRg('${ago(29)}','${td}')`, 'Last 30 days')}${btn(`setRg('','')`, 'Clear')}</div>`;
  },
  kp = (l, v, c, sub) => `<div class="c k"><span>${t(l)}</span><b class=${c || ''}>${v}</b>${sub ? `<span>${sub}</span>` : ''}</div>`,
  invStats = () => {
    const ps = db.prods.filter(p => !p.arch);
    return {
      ps,
      low: ps.filter(p => lvl(p) == 'low'),
      out: ps.filter(p => lvl(p) == 'out'),
      nop: ps.filter(p => !p.pp).length,
      sv: ps.reduce((n, p) => n + p.stock * (+p.pp || 0), 0)
    };
  },
  remTxt = x => {
    const o = x.refId != null ? db.moves.find(m => m.id == x.refId) || {} : null;
    return (o ? `${t('Reversal of')} ${e(o.d)} ${e(o.tm || '')}${x.rem ? ' \u00b7 ' : ''}` : '') + e(x.rem);
  };

// Per-product movement history with running balance (respects the active date range).
function hist(id) {
  const p = P(id),
    rs = revSet();
  let bal = p.stock;
  const rows = db.moves.filter(m => m.pid == id).reverse().map(m => {
    const a = bal;
    bal -= eff(m);
    return [m, a];
  }).filter(r => inR(r[0].d));
  modal(
    'History',
    `<p class=mu><b>${e(p.name)}</b> \u00b7 ${t('Stock')}: ${p.stock} ${e(p.unit)}${RG.f || RG.to ? ` \u00b7 ${e(RG.f || '\u2026')} \u2013 ${e(RG.to || '\u2026')}` : ''}</p>` +
      (rows.length ? `<div style="overflow-x:auto"><table><tr>${['Date', 'Time', 'Batch', 'Type', 'Reason', 'Quantity', 'Balance', 'Remarks'].map(h => `<th>${t(h)}</th>`).join('')}</tr>${rows.map(([m, a]) => `<tr><td>${e(m.d)}</td><td>${e(m.tm || '-')}</td><td>${e(shName(m.sh))}</td><td>${tl(m.type)}</td><td>${t(m.reason || '')}</td><td>${qtyTxt(m)}</td><td>${a}</td><td>${remTxt(m)}${rs.has(m.id) ? ` <span class=mu>(${t('Reversed')})</span>` : ''}</td></tr>`).join('')}</table></div>` : `<div class=es>${t('Nothing here yet')}</div>`),
    0,
    1
  );
}

// rows: arrays of cell HTML, or {c: cells, k: row class}
function tbl(h, rows) {
  if (!rows.length) return `<div class=es>${t('Nothing here yet')}</div>`;
  const n = Math.ceil(rows.length / 20);
  page = Math.min(page, n - 1);
  return `<div class=c><table><tr>${h.map(x=>`<th>${t(x)}</th>`).join('')}</tr>${rows.slice(page*20,page*20+20).map(r=>`<tr ${r.k?'class='+r.k:''}>${(Array.isArray(r)?r:r.c).map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</table>${n>1?`<div class=tb style="margin:8px 0 0"><button onclick="page--;go(view)" ${page?'':'disabled'}>${t('Previous')}</button><span class=mu>${page+1}/${n}</span><button onclick="page++;go(view)" ${page<n-1?'':'disabled'}>${t('Next')}</button></div>`:''}</div>`;
}

// Sums quantities per unit so kg, bags and packets are never added together.
const sumU = (a, ty) => {
    const o = {};
    a.forEach(x => {
      if (ty && x.type != ty) return;
      const u = P(x.pid).unit || '-';
      o[u] = (o[u] || 0) + x.qty;
    });
    return o;
  },
  addU = (a, b, k = 1) => {
    const o = { ...a };
    Object.keys(b).forEach(u => (o[u] = (o[u] || 0) + k * b[u]));
    return o;
  },
  fmtU = o => Object.keys(o).filter(u => o[u]).map(u => `${Math.round(o[u] * 100) / 100} ${e(u)}`).join(' \u00b7 ') || '0',
  negU = o => Object.values(o).some(v => v < 0);
const bars = it => {
  const m = Math.max(1, ...it.map(x => x[1]));
  return it.map(x => `<div class=bar><em>${e(x[0])}</em><i style="width:${x[1]/m*60}%"></i>${Math.round(x[1]).toLocaleString('en-IN')}</div>`).join('') ||
    `<div class=mu>${t('Nothing here yet')}</div>`;
};
const mon = d => d.slice(0, 7);
const B = (h, n) => `<div class=tb><h2>${t(h)}</h2>${n||''}</div>`,
  btn = (f, l, c) => `<button class="${c||''}" onclick="${f}">${t(l)}</button>`;
const V = {
  dash() {
    const { ps, low, out, nop, sv } = invStats(),
      any = RG.f || RG.to,
      td = shiftDate(),
      rf = any ? RG.f : td,
      rt = any ? RG.to : td,
      inr = d => (!rf || d >= rf) && (!rt || d <= rt),
      lbl = any ? `${e(rf || '\u2026')} \u2013 ${e(rt || '\u2026')}` : td,
      al = [[out, 'Out of Stock'], [low, 'Low Stock Items']].filter(x => x[0].length).map(x => `${t(x[1])}: ${x[0].map(p => e(p.name)).join(', ')}`).join(' \u00b7 ');
    // Originals reversed (all-time / same-range) are excluded from in/out totals; the ledger still shows both rows.
    const rs = revSet(),
      mvl = db.moves.filter(x => !rs.has(x.id) && inr(x.d)),
      mi = sumU(mvl, 'in'),
      mo = sumU(mvl, 'out'),
      mvBars = [].concat(
        Object.keys(mi).map(u => [`${t('Batch In')} (${u})`, mi[u]]),
        Object.keys(mo).map(u => [`${t('Batch Out')} (${u})`, mo[u]])
      );
    const cy = db.moves.filter(x => inr(x.d)),
      ri = new Set(cy.filter(x => x.refId).map(x => x.refId)),
      lv = cy.filter(x => !ri.has(x.id)),
      sum = (a, ty) => a.filter(x => x.type == ty).reduce((s, x) => s + x.qty, 0),
      b1 = sumU(lv.filter(x => x.sh == '1'), 'in'),
      b2 = sumU(lv.filter(x => x.sh == '2'), 'in'),
      dl = sumU(lv, 'out'),
      bal = addU(addU(b1, b2), dl, -1),
      ss = ps.map(p => {
        const m = cy.filter(x => x.pid == p.id),
          l = lv.filter(x => x.pid == p.id),
          i = sum(l, 'in'), o = sum(l, 'out'),
          net = m.reduce((s, x) => s + eff(x), 0),
          after = rt ? db.moves.filter(x => x.pid == p.id && x.d > rt).reduce((s, x) => s + eff(x), 0) : 0,
          close = p.stock - after;
        return [e(p.name), close - net, i, o, net - (i - o), close];
      });
    return `${al?`<div class="c bad" style="margin-bottom:10px">⚠ ${al}</div>`:''}<div class=g>${kp('Total Products',ps.length)}${kp('Total Categories',db.cats.length)}${kp('Low Stock Items',low.length,low.length?'bad':'')}${kp('Out of Stock',out.length,out.length?'bad':'')}${kp('Inventory Value',money(sv),'',nop?`${nop} ${t('without price')}`:'')}</div>
<div class=c style="margin-bottom:10px"><b>${t('Quick Actions')}</b><div class=tb style="margin:8px 0 0">${btn('edit()','Add Product')}${btn('stockForm()','Batch In','p')}${btn(`stockForm(null,'out')`,'Batch Out','p')}${btn('adjForm()','Adjust Stock')}</div></div>
${rangeBar()}<div class=g style="grid-template-columns:repeat(auto-fit,minmax(260px,1fr))"><div class=c><b>${t('Inventory Movement')}</b> <span class=mu>${lbl}</span>${bars(mvBars)}</div></div>
<h3>${t(any?'Batch Summary':'Batch Summary (Today)')} <span class=mu>${lbl}</span></h3><div class=g>${kp('Batch 1',fmtU(b1))}${kp('Batch 2',fmtU(b2))}${kp('Total Batch',fmtU(addU(b1,b2)))}${kp('Batch Out',fmtU(dl))}${kp('Balance Left',fmtU(bal),negU(bal)?'bad':'ok')}</div>
<h3>${t(any?'Stock Summary':'Stock Summary (Today)')} <span class=mu>${lbl}</span></h3>${tbl(['Name','Opening Stock','Batch In','Batch Out','Adjustment','Closing Stock'],ss)}
<h3>${t('Recent Stock Entries')}</h3>${tbl(['Date','Batch','Name','Type','Quantity'],db.moves.slice(-5).reverse().map(x=>[x.d,e(shName(x.sh)),e(P(x.pid).name),tl(x.type),qtyTxt(x)]))}`;
  },
  prod() {
    const { low, out, nop, sv } = invStats(),
      rk = p => p.arch ? 3 : { out: 0, low: 1, ok: 2 }[lvl(p)],
      bdg = p => p.arch ? '-' : { out: `<span class=bd>${t('Out')}</span>`, low: `<span class=wb>${t('Low')}</span>`, ok: `<span class=ok>${t('OK')}</span>` }[lvl(p)],
      // Out first, then Low, then OK, archived last.
      rows = srch(
        [...db.prods].sort((a, b) => rk(a) - rk(b) || a.name.localeCompare(b.name)).map(p => ({
          k: p.arch || lvl(p) == 'ok' ? '' : lvl(p),
          c: [
            e(p.name) + (p.arch ? ` <span class=mu>(${t('Archived')})</span>` : ''),
            e(p.sku),
            e(p.cat),
            e(p.unit),
            p.stock,
            p.min,
            p.pp ? money(p.pp) : '-',
            p.pp ? money(p.stock * p.pp) : '-',
            bdg(p),
            `<button onclick="edit('${p.id}')">${t('Edit')}</button> ${!p.arch&&lvl(p)!='ok'?`<button class=p onclick="${isBatch(p)?`stockForm('${p.id}')`:`adjForm('${p.id}','1','Purchase Received')`}">${t('Restock')}</button>`:''} <button onclick="hist('${p.id}')">${t('History')}</button> <button onclick="arch('${p.id}')">${t(p.arch?'Unarchive':'Archive')}</button> <button class=x onclick="del('${p.id}')">${t('Delete')}</button>`
          ]
        })),
        1
      );
    return B('Products', btn('edit()', 'Add Product', 'p')) +
      `<div class=g>${kp('Inventory Value', money(sv), '', nop ? `${nop} ${t('without price')}` : '')}${kp('Low Stock Items', low.length, low.length ? 'bad' : '')}${kp('Out of Stock', out.length, out.length ? 'bad' : '')}</div>` +
      tbl(['Name', 'SKU', 'Category', 'Unit', 'Stock', 'Minimum Stock', 'Purchase Price', 'Stock Value', 'Status', 'Actions'], rows);
  },
  usr() {
    return B('Users', btn('addUser()', 'Add', 'p')) +
      tbl(['Username', 'Actions'], Object.keys(users).map(u => [e(u), u == S.g('adm') ? '' : `<button class=x onclick="delUser('${e(u)}')">${t('Delete')}</button>`]));
  },
  stock() {
    const sf = window._sf || '',
      rs = revSet(),
      mvs = db.moves.filter(x => inR(x.d) && (!sf || x.sh == sf)),
      live = ty => fmtU(sumU(mvs.filter(x => !rs.has(x.id)), ty)),
      rows = srch(
        mvs.slice().reverse().map(x => ({
          c: [
            x.d,
            e(x.tm || '-'),
            e(shName(x.sh)),
            e(P(x.pid).name),
            tl(x.type),
            t(x.reason || ''),
            qtyTxt(x),
            remTxt(x),
            rs.has(x.id) ? `<span class=mu>${t('Reversed')}</span>` : x.refId == null && REVERSIBLE.includes(x.type) ? `<button onclick="revMove('${x.id}')">${t('Reverse')}</button>` : ''
          ]
        })),
        1
      );
    return B(
      'Stock',
      `<select onchange="_sf=this.value;page=0;go('stock')"><option value="">${t('All Batches')}</option>${['1','2','3'].map(s=>`<option value="${s}" ${sf==s?'selected':''}>${e(shName(s))}</option>`).join('')}</select>${btn('stockForm()', 'Batch In', 'p')}${btn(`stockForm(null,'out')`, 'Batch Out', 'p')}${btn('adjForm()', 'Adjust Stock')}`
    ) +
      rangeBar() +
      `<div class=g>${kp('Batch In', live('in'))}${kp('Batch Out', live('out'))}${kp('Stock Entry', mvs.length)}</div>` +
      tbl(['Date', 'Time', 'Batch', 'Name', 'Type', 'Reason', 'Quantity', 'Remarks', 'Actions'], rows);
  }
};

function go(v) {
  document.documentElement.lang = lang;
  if (v != view) page = 0;
  view = v;
  $('#nv').innerHTML = `<h1>Rangoli ERP</h1>` +
    NAV.filter(n => n[0] != 'usr' || S.g('adm') == S.g('se')).map(n => `<a class="${n[0]==v?'on':''}" tabindex=0 onclick="go('${n[0]}')">${t(n[1])}</a>`).join('') + `<a tabindex=0 onclick=logout()>${t('Logout')} (${e(S.g('se'))})</a>`;
  $('#bc').textContent = 'Rangoli ERP / ' + t(NAV.find(n => n[0] == v)[1]);
  $('#q').placeholder = t('Search');
  $('#bk').textContent = t('Backup');
  $('#th').textContent = document.documentElement.dataset.theme == 'dark' ? t('Light') : t('Dark');
  try {
    $('#v').innerHTML = V[v]();
  } catch (x) {
    $('#v').innerHTML = '<div class=es>Error: ' + e(x.message) + '</div>';
  }
}

function theme(d) {
  document.documentElement.dataset.theme = d;
  S.s('thm', d);
}

{
  const s = S.g('thm') || (matchMedia('(prefers-color-scheme:dark)').matches ? 'dark' : 'light');
  theme(s);
}
$('#bk').onclick = backup;
$('#th').onclick = () => {
  theme(document.documentElement.dataset.theme == 'dark' ? 'light' : 'dark');
  go(view);
  toast('Theme Changed');
};
$('#lg').value = lang;
$('#lg').onchange = ev => {
  lang = ev.target.value;
  S.s('lg', lang);
  go(view);
  toast('Language Changed');
};
$('#q').oninput = () => {
  page = 0;
  go(view);
};
document.addEventListener('keydown', ev => {
  if (ev.key == 'Escape') cl();
  if (/INPUT|SELECT|TEXTAREA/.test(ev.target.tagName) || ev.ctrlKey || ev.metaKey) return;
  const k = ev.key.toLowerCase();
  if (k == 'p') {
    ev.preventDefault();
    edit();
  } else if (k == 's') {
    ev.preventDefault();
    stockForm();
  } else if (k == '/') {
    ev.preventDefault();
    $('#q').focus();
  }
});

// ---- Server connection & login ----
const TK = 'tok';
let users = {};

async function api(path, o = {}) {
  const h = { 'Content-Type': 'application/json' }, tk = S.g(TK);
  if (tk) h.Authorization = 'Bearer ' + tk;
  let r, d = {};
  try {
    r = await fetch(path, { method: o.method || 'GET', headers: h, body: o.body ? JSON.stringify(o.body) : undefined });
  } catch (x) {
    return { ok: false, status: 0, d };
  }
  try {
    d = await r.json();
  } catch (x) {}
  if (r.status == 401 && path != '/api/login' && path != '/api/setup') expired();
  return { ok: r.ok, status: r.status, d };
}

function clearSession() {
  try {
    ['tok', 'se', 'adm'].forEach(k => localStorage.removeItem(k));
  } catch (x) {}
}
function expired() {
  clearSession();
  loginView();
}

async function loadDb() {
  const r = await api('/api/db');
  if (!r.ok) throw new Error('load');
  if (r.d.db) {
    db = migrate(r.d.db);
    ver = r.d.version;
  } else {
    // First run: the server is empty, so start with the sample data (Backup > Import JSON replaces it).
    db = migrate(seed());
    const w = await api('/api/db', { method: 'POST', body: { db, version: 0 } });
    if (w.status == 409) {
      db = migrate(w.d.db);
      ver = w.d.version;
    } else if (w.ok) ver = w.d.version;
    else throw new Error('save');
  }
  snap = JSON.stringify(db);
}

async function loadUsers() {
  const r = await api('/api/users');
  users = {};
  if (r.ok) r.d.users.forEach(u => users[u.username] = 1);
}

function addUser() {
  form('Add', [['u', 'Username', '', 0, 1], ['p', 'Password', 'password', 0, 1]], {}, o => {
    const u = o.u.trim().toLowerCase();
    if (!/^[a-z0-9._@-]{2,60}$/.test(u) || o.p.length < 6) {
      toast('Username: letters/numbers, 2+ characters. Password: 6+ characters.');
      return false;
    }
    api('/api/users', { method: 'POST', body: { u, p: o.p } }).then(async r => {
      if (!r.ok) return toast(r.d.error || 'Could not add user');
      await loadUsers();
      go('usr');
    });
  });
}
function delUser(u) {
  if (u == S.g('adm')) return;
  ask(t('Delete this item?'), async () => {
    await api('/api/users/' + encodeURIComponent(u), { method: 'DELETE' });
    await loadUsers();
    go('usr');
  });
}
async function logout() {
  await api('/api/logout', { method: 'POST' });
  clearSession();
  loginView();
}

async function boot(u, admin) {
  S.s('se', u);
  S.s('adm', admin ? u : '');
  try {
    await loadDb();
    if (admin) await loadUsers();
  } catch (x) {
    toast('Could not load data from the server.');
    return loginView();
  }
  start(u);
}
function start(u) {
  S.s('se', u);
  cl();
  go('dash');
  try {
    if (window.Notification && Notification.permission == 'default') Notification.requestPermission();
  } catch (x) {}
}

async function loginView() {
  const st = await api('/api/status'),
    first = !!st.d.needsSetup;
  $('#m').innerHTML = `<div class=mb><div class=md><h3>Rangoli ERP</h3><label>${t('Username')}<input id=lu autocomplete=username autocapitalize=none></label><label>${t('Password')}<input id=lp type=password autocomplete=current-password></label><small class=bad id=le></small><div class=ac><button class=p id=lb>${first ? t('Create Admin') : t('Login')}</button></div></div></div>`;
  const go_ = async () => {
    const u = $('#lu').value.trim().toLowerCase(),
      p = $('#lp').value;
    if (!/^[a-z0-9._@-]{2,60}$/.test(u) || p.length < 6) {
      $('#le').textContent = 'Username 2+ characters, password 6+ characters';
      return;
    }
    $('#lb').disabled = true;
    const r = await api(first ? '/api/setup' : '/api/login', { method: 'POST', body: { u, p } });
    $('#lb').disabled = false;
    if (!r.ok) {
      $('#le').textContent = r.status == 0 ? 'Cannot reach the server' : r.d.error || 'Login failed';
      return;
    }
    S.s(TK, r.d.token);
    boot(r.d.user, r.d.admin);
  };
  $('#lb').onclick = go_;
  $('#lp').onkeydown = ev => {
    if (ev.key == 'Enter') go_();
  };
}

// Pick up other people's changes (every 20 s and whenever the app is reopened).
async function refresh() {
  if (!S.g(TK) || !S.g('se') || document.hidden || pend) return;
  const r = await api('/api/db?since=' + ver);
  if (pend || !r.ok || r.d.same || !r.d.db) return; // never overwrite a change that is still being saved
  db = migrate(r.d.db);
  ver = r.d.version;
  snap = JSON.stringify(db);
  go(view);
}
setInterval(refresh, 20000);
document.addEventListener('visibilitychange', refresh);

// ---- Low-stock notification at 5:00 PM and 1:00 AM (page must be open) ----
function notifyLow() {
  const l = db.prods.filter(p => !p.arch && isLow(p));
  if (!l.length) return;
  const text = 'Low stock: ' + l.map(p => p.name + ' ' + p.stock + ' ' + p.unit).join(', ');
  toast(text);
  try {
    if (window.Notification && Notification.permission == 'granted') new Notification('Rangoli ERP', { body: text });
  } catch (x) {}
}
setInterval(() => {
  const n = new Date(),
    k = ymd(n) + pad(n.getHours());
  if (S.g('se') && n.getMinutes() == 0 && (n.getHours() == 17 || n.getHours() == 1) && S.g('ln') != k) {
    S.s('ln', k);
    notifyLow();
  }
}, 20000);

(async function init() {
  try {
    if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(() => {});
  } catch (x) {}
  if (S.g(TK)) {
    const r = await api('/api/me');
    if (r.ok) return boot(r.d.user, r.d.admin);
    if (r.status == 401) return; // expired() already showed the login screen
  }
  loginView();
})();
